    <script>
      (function(){
        var h=document.documentElement;
        var saved=localStorage.getItem('theme');
        if(saved==='light'){h.classList.remove('dark');}
        else if(saved==='dark'){h.classList.add('dark');}
        else if(window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches){h.classList.remove('dark');}
      })();
    </script>
